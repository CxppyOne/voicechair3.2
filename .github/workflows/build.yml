name: Build Fabric 26.1 Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Mod-Ordner automatisch finden
        id: find-gradle
        run: |
          GRADLE_FILE=$(find . -maxdepth 3 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "❌ FEHLER: Keine build.gradle im Repository gefunden! Lade bitte alle Gradle-Dateien hoch."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Gefundenes Projektverzeichnis: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Gradle Cache & Setup
        uses: gradle/actions/setup-gradle@v4

      - name: Mod bauen
        working-directory: ${{ steps.find-gradle.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Fertige JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mod-26.1
          path: |
            ${{ steps.find-gradle.outputs.dir }}/build/libs/*.jar
            !${{ steps.find-gradle.outputs.dir }}/build/libs/*-sources.jar
